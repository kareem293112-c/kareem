<!doctype html>
<html lang="ar" dir="rtl" style="background-color: #03000a; color: #f3f4f6; width: 100%; height: 100%; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#03000a" />
    <title>صدى العرب - التطبيق الصوتي المميز</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      html, body, #root {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #03000a !important;
        color: #f3f4f6 !important;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      /* Hide all scrollbars for native mobile feel */
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      * {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
    </style>
  </head>
  <body style="background-color: #03000a; color: #f3f4f6; width: 100vw; height: 100vh; height: 100dvh; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none;">
    <div id="root" style="width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
